# Mantém o bot do Clipador ligado nos servidores do GitHub, em turnos de ~6 horas.
# Cada turno restaura o estado, atende os botões do Telegram e gera os vídeos nos horários marcados.
name: Clipador

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"   # um turno a cada 6 h (horário UTC)
  workflow_dispatch: {}            # botão "Run workflow" para ligar na hora

permissions:
  contents: write                  # salvar o estado e guardar os vídeos nas Releases

concurrency:
  group: clipador                  # nunca dois bots ao mesmo tempo
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      TZ: America/Sao_Paulo
      PYTHONIOENCODING: utf-8
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CLIPADOR_ARROBA: ${{ vars.CLIPADOR_ARROBA || '@clipador' }}
      CLIPADOR_HORARIOS: ${{ vars.CLIPADOR_HORARIOS || '10:00,18:00' }}
      CLIPADOR_MAX_MINUTOS: "340"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Rodar o bot
        run: python -u telegram_bot.py
