<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autorização do TikTok · Playclips</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:40px auto;padding:0 16px;line-height:1.6;color:#222}a{color:#6b3fd6}textarea{width:100%;height:120px;font:14px monospace}</style>
</head><body>
<h1>Autorização do TikTok</h1>
<p id="msg">Esta página recebe a autorização do TikTok para o Clipador, a ferramenta interna da Playclips.</p>
<textarea id="end" readonly hidden></textarea>
<p><a href="index.html">Playclips</a> · <a href="privacidade.html">Privacidade</a> · <a href="termos.html">Termos</a></p>
<script>
var q = new URLSearchParams(location.search);
if (q.get("code")) {
  document.getElementById("msg").textContent = "Autorizado. Copie o endereço abaixo e mande no chat do Clipador:";
  var t = document.getElementById("end"); t.hidden = false; t.value = location.href; t.select();
} else if (q.get("error")) {
  document.getElementById("msg").textContent = "O TikTok não autorizou: " + (q.get("error_description") || q.get("error"));
}
</script>
</body></html>
